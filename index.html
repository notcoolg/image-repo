<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8YXN09KDRP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8YXN09KDRP');
  </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Image Gallery</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      overflow: hidden; /* Hide scrollbars */
    }
    .image-container {
      position: relative;
      display: flex;
      overflow: hidden; /* Hide scrollbars */
      width: 1000px;
      height: 250px;
      white-space: nowrap;
      background-color: #fff;
      border: 1px solid #ddd;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .image-container img {
      height: 250px;
      margin-right: 10px;
      transition: transform 0.3s ease;
      pointer-events: none;
      user-select: none;
    }
    .image-container img:hover {
      transform: scale(0.9);
    }
    .tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: transparent;
      color: white;
      padding: 5px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
    }
    .tag:before {
      content: 'ℹ️'; /* Info icon */
      font-size: 20px;
    }
    .tag:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }
    .tooltip {
      visibility: hidden;
      width: 150px;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 5px;
      position: absolute;
      z-index: 10;
      right: 10px;
      top: 35px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .tooltip::after {
      content: '';
      position: absolute;
      top: -5px;
      right: 20px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent rgba(0, 0, 0, 0.7) transparent;
    }
  </style>
  <!-- Load the advertiser tags -->
  <script src="advertisers.js"></script>
</head>
<body>
  <div id="image-container" class="image-container"></div>

  <script>
    const images = [
      { src: 'images/image1.png', href: 'https://ads.xxavvgroup.com', alt: 'Check out xxavvADS by clicking on the link!', advertiser: 'xxavvADS' },
      { src: 'images/image2.png', href: 'https://6ames.xxavvgroup.com', alt: 'Check out xxavv6AMES website by clicking on the ad!', advertiser: 'xxavv6AMES' },
      { src: 'images/image3.gif', href: 'https://musik.xxavvgroup.com', alt: 'Check out xxavvMusik\'s website by clicking anywhere on the ad!', advertiser: 'xxavvMusik' }
    ];

    function displayImage(index) {
      const container = document.getElementById('image-container');
      container.innerHTML = ''; // Clear existing content

      const image = images[index];
      const anchor = document.createElement('a');
      anchor.href = image.href;
      anchor.target = '_blank';

      const img = document.createElement('img');
      img.src = image.src;
      img.alt = image.alt;

      anchor.appendChild(img);
      container.appendChild(anchor);

      // Create the tag dynamically using the advertisers.js data
      const advertiserTag = advertisers[image.advertiser];
      if (advertiserTag) {
        const tag = document.createElement('a');
        tag.href = advertiserTag.href;
        tag.className = 'tag';
        tag.target = '_blank';

        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip';
        tooltip.innerText = advertiserTag.text;

        tag.appendChild(tooltip);
        container.appendChild(tag);
      }
    }

    function getRandomIndex() {
      return Math.floor(Math.random() * images.length);
    }

    function startSlideshow() {
      let currentIndex = getRandomIndex();
      displayImage(currentIndex);

      setInterval(() => {
        currentIndex = (currentIndex + 1) % images.length;
        displayImage(currentIndex);
      }, 10000); // Change image every 10 seconds
    }

    document.addEventListener('DOMContentLoaded', startSlideshow);
  </script>
</body>
</html>
