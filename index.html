<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xxavvADS Programatic Ad Carousel (PAC)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .ad-frame {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ad-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #fff;
      overflow: hidden;
    }

    .ad-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ad-container img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: transform 0.2s;
    }

    /* For landscape orientation */
    @media (min-aspect-ratio: 16/9) {
      .ad-container img {
        width: 100%;
        height: auto;
      }
    }

    /* For portrait orientation */
    @media (max-aspect-ratio: 16/9) {
      .ad-container img {
        width: auto;
        height: 100%;
      }
    }

    .ad-container:hover img {
      transform: scale(0.98);
    }

    .info-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      cursor: pointer;
    }

    .info-tag:hover .tooltip {
      opacity: 1;
      visibility: visible;
    }

    .info-icon {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      width: min(24px, 8%);
      height: min(24px, 8%);
      min-width: 16px;
      min-height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(10px, 2vw, 14px);
    }

    .tooltip {
      position: absolute;
      top: 110%;
      right: 0;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: clamp(4px, 1vw, 8px) clamp(6px, 1.5vw, 12px);
      border-radius: 4px;
      font-size: clamp(10px, 1.5vw, 12px);
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }

    /* Adjust tooltip position for small containers */
    @media (max-width: 300px), (max-height: 200px) {
      .tooltip {
        right: -10px;
        transform: translateX(100%);
        top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="ad-frame">
    <div id="adContainer" class="ad-container"></div>
  </div>

  <!-- Load the ad configuration -->
  <script src="ad-config.js"></script>

  <script>
    class AdSystem {
      constructor(config) {
        this.config = config;
        this.currentIndex = 0;
        this.container = document.getElementById('adContainer');
        this.initialize();
      }

      initialize() {
        if (!this.config || !this.config.ads || !this.config.ads.length) {
          console.error('Invalid ad configuration');
          return;
        }
        this.showAd();
        if (this.config.ads.length > 1) {
          this.startRotation();
        }

        // Add resize observer to handle container size changes
        const resizeObserver = new ResizeObserver(entries => {
          for (const entry of entries) {
            this.handleResize(entry.contentRect);
          }
        });
        resizeObserver.observe(this.container);
      }

      handleResize(rect) {
        document.documentElement.style.setProperty('--container-width', `${rect.width}px`);
        document.documentElement.style.setProperty('--container-height', `${rect.height}px`);
      }

      showAd() {
        const ad = this.config.ads[this.currentIndex];
        this.container.innerHTML = `
          <div class="ad-content">
            <a href="${ad.href}" target="_blank" rel="noopener">
              <img 
                src="${ad.src}" 
                alt="${ad.alt || 'Advertisement'}"
                loading="lazy"
              >
            </a>
            ${this.createInfoTag(ad)}
          </div>
        `;
      }

      createInfoTag(ad) {
        if (!ad.infoText) return '';
        return `
          <div class="info-tag">
            <div class="info-icon">i</div>
            <div class="tooltip">${ad.infoText}</div>
          </div>
        `;
      }

      startRotation() {
        setInterval(() => {
          this.currentIndex = (this.currentIndex + 1) % this.config.ads.length;
          this.showAd();
        }, this.config.rotationInterval || 10000);
      }
    }

    // Initialize the ad system with the loaded configuration
    document.addEventListener('DOMContentLoaded', () => {
      new AdSystem(adConfig);
    });
  </script>
</body>
</html>
